<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Dark green background circle -->
  <circle cx="60" cy="60" r="60" fill="#1a5c2a"/>

  <!-- Leaf / sprout stem -->
  <path d="M60 88 L60 52" stroke="#7cc956" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left leaf -->
  <path d="M60 65 Q44 56 42 40 Q58 42 60 58" fill="#7cc956"/>

  <!-- Right leaf -->
  <path d="M60 58 Q76 48 80 32 Q62 36 60 52" fill="#a8e063"/>

  <!-- Network nodes: 3 people/dots connected -->
  <circle cx="32" cy="85" r="7" fill="#7cc956"/>
  <circle cx="88" cy="85" r="7" fill="#7cc956"/>
  <circle cx="60" cy="97" r="5.5" fill="#a8e063"/>

  <!-- Connection lines -->
  <line x1="32" y1="85" x2="60" y2="97" stroke="#7cc956" stroke-width="2" stroke-linecap="round"/>
  <line x1="88" y1="85" x2="60" y2="97" stroke="#7cc956" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="85" x2="88" y2="85" stroke="#7cc956" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- Person silhouette left -->
  <circle cx="32" cy="79" r="4.5" fill="#a8e063"/>
  <path d="M26 89 Q32 85 38 89" stroke="#a8e063" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Person silhouette right -->
  <circle cx="88" cy="79" r="4.5" fill="#a8e063"/>
  <path d="M82 89 Q88 85 94 89" stroke="#a8e063" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
